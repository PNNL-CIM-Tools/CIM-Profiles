# Publishes the JSON-LD contexts and unit vocabularies built by
# `python -m cimprofiles.jsonld.build` to GitHub Pages:
#   https://pnnl-cim-tools.github.io/CIM-Profiles/<profile>/context.jsonld
#   https://pnnl-cim-tools.github.io/CIM-Profiles/<profile>/units-<convention>.jsonld
# The same files ship in the wheel (src/cimprofiles/jsonld/cache) for offline use.
# Third-party copies (cache/inst4cim) are not republished.
#
# One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "src/cimprofiles/jsonld/cache/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Collect published documents
        run: |
          mkdir _site
          for dir in src/cimprofiles/jsonld/cache/*/; do
            [ "$(basename "$dir")" = inst4cim ] || cp -r "$dir" _site/
          done
          ls -R _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
