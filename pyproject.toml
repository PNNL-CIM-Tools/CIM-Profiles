[project]
name = "cimprofiles"
version = "0.1.0a1"
description = "CIM data profiles (Python dataclasses) and the Identity/units object model used by CIMantic Graphs"
authors = [
    {name = "A. Anderson", email = "19935503+AAndersn@users.noreply.github.com"},
    {name = "C. Allwardt", email = "3979063+craig8@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["cim", "power-systems", "iec-61970", "iec-61968", "cgmes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pint>=0.24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    # build_merged_profiles reads merge_releases.yaml
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/PNNL-CIM-Tools/CIM-Profiles"
Repository = "https://github.com/PNNL-CIM-Tools/CIM-Profiles"
Issues = "https://github.com/PNNL-CIM-Tools/CIM-Profiles/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimprofiles"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/cimprofiles",
    "/tests",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
